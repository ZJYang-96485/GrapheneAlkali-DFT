# Locked Phase 2C Quantum ESPRESSO methodology for bare graphene substrates.

paths:
  input_root: qe_inputs/relaxation
  pseudo_dir: pseudopotentials
  scratch_root: qe_scratch

pseudopotentials:
  family: SSSP Efficiency PBE
  files:
    C: C.pbe-n-kjpaw_psl.1.0.0.UPF
    Li: li_pbe_v1.4.uspp.F.UPF
    Na: na_pbe_v1.5.uspp.F.UPF

dft:
  software: Quantum ESPRESSO
  xc_functional: PBE
  dispersion:
    method: D3
    damping: BJ
    qe_vdw_corr: dft-d3
    qe_dftd3_version: 4
    threebody: true
  ecutwfc_ry: 50
  ecutrho_ry: 400
  occupations: smearing
  smearing: mv
  conv_thr: 1.0e-8
  mixing_beta: 0.3
  assume_isolated: 2D
  nbnd: null

relaxation:
  calculation: relax
  k_points:
    mesh: [6, 6, 1]
    shift: [0, 0, 0]
  degauss_ry: 0.01
  forc_conv_thr: 4.0e-4
  ion_dynamics: bfgs

final_scf:
  k_points:
    mesh: [9, 9, 1]
    shift: [0, 0, 0]
  degauss_ry: 0.005

dos:
  k_points:
    mesh: [12, 12, 1]
    shift: [0, 0, 0]

systems:
  pristine:
    structure: structures/pristine/graphene_5x5_pristine.traj
    prefix: graphene_pristine
    nspin: 1

  monovacancy:
    structure: structures/monovacancy/graphene_5x5_monovacancy.traj
    pristine_reference: structures/pristine/graphene_5x5_pristine.traj
    prefix: graphene_monovacancy
    nspin: 2
    starting_magnetization:
      bulk_C: 0.0
      vacancy_neighbor_C: 0.1

gpu:
  platform: WSL2 Ubuntu
  device_count: 1
  mpi_ranks: 1
  executable: pw.x
  openmp_threads_environment: OMP_NUM_THREADS
